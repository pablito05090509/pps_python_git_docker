version: "3.9"

services:
  bayeta_app:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - mongo_db
    networks:
      - bayeta_net

  mongo_db:
    image: mongo:7
    container_name: mongo_db
    ports:
      - "27017:27017"
    networks:
      - bayeta_net
    volumes:
      - mongo_data:/data/db

networks:
  bayeta_net:

volumes:
  mongo_data:

